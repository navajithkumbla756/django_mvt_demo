openapi: 3.0.3
info:
  title: ATS Recruitment Portal & Analytics API
  version: 1.0.0
  description: Production REST API documentation
paths:
  /api/admin/metrics/:
    get:
      operationId: admin_metrics_retrieve
      description: |-
        Endpoint: GET /api/admin/metrics/
        GET: Restricted strictly to ADMIN accounts.
      summary: System Admin Metrics
      tags:
      - admin
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Platform telemetry & user statistics
  /api/analytics/funnel/:
    get:
      operationId: analytics_funnel_retrieve
      description: Calculates conversion metrics (applied -> shortlisted -> interview
        -> selected) for a specific job.
      summary: Recruiter Stage-to-Stage Application Funnel
      parameters:
      - in: query
        name: job_id
        schema:
          type: integer
        description: Filter funnel by specific Job ID owned by recruiter.
      tags:
      - analytics
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Conversion funnel metrics calculated successfully.
        '403':
          description: Forbidden - Recruiter does not own this job.
        '404':
          description: Job not found.
  /api/analytics/trends/:
    get:
      operationId: analytics_trends_retrieve
      description: Provides candidate application volume grouped by job title over
        a configurable sliding day window.
      summary: Sliding Window Candidate Sourcing Trends
      parameters:
      - in: query
        name: days
        schema:
          type: integer
          default: 30
        description: 'Window duration in days (default: 30).'
      tags:
      - analytics
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Candidate volume metrics grouped by job title.
  /api/applications/:
    post:
      operationId: applications_create
      description: |-
        Endpoint: POST /api/applications/
        POST: Restricted to CANDIDATES only. Auto-links the profile context.
      tags:
      - applications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Application'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Application'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTokenObtainPair'
          description: ''
  /api/auth/token/logout/:
    post:
      operationId: auth_token_logout_create
      description: |-
        Takes a token and blacklists it. Must be used with the
        `rest_framework_simplejwt.token_blacklist` app installed.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenBlacklist'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/jobs/:
    get:
      operationId: jobs_list
      description: |-
        Endpoint: GET/POST /api/jobs/
        GET: Anyone authenticated can browse jobs.
        POST: Restricted to corporate EMPLOYERS only.
      tags:
      - jobs
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
          description: ''
    post:
      operationId: jobs_create
      description: |-
        Endpoint: GET/POST /api/jobs/
        GET: Anyone authenticated can browse jobs.
        POST: Restricted to corporate EMPLOYERS only.
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Job'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Job'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
  /api/jobs/{id}/:
    get:
      operationId: jobs_retrieve
      description: |-
        Endpoint: GET/PUT/DELETE /api/jobs/<id>/
        PUT/DELETE: Restricted to the specific EMPLOYER owner who created the post.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - jobs
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
    put:
      operationId: jobs_update
      description: |-
        Endpoint: GET/PUT/DELETE /api/jobs/<id>/
        PUT/DELETE: Restricted to the specific EMPLOYER owner who created the post.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Job'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Job'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
    patch:
      operationId: jobs_partial_update
      description: |-
        Endpoint: GET/PUT/DELETE /api/jobs/<id>/
        PUT/DELETE: Restricted to the specific EMPLOYER owner who created the post.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJob'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedJob'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedJob'
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          description: ''
    delete:
      operationId: jobs_destroy
      description: |-
        Endpoint: GET/PUT/DELETE /api/jobs/<id>/
        PUT/DELETE: Restricted to the specific EMPLOYER owner who created the post.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - jobs
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: No response body
  /api/resumes/{candidate_id}/download-url/:
    get:
      operationId: resumes_download_url_retrieve
      description: Generates an AWS SigV4 pre-signed URL with a 300-second expiration
        for authorized recruiters.
      summary: Generate Pre-Signed S3 Resume Download URL
      parameters:
      - in: path
        name: candidate_id
        schema:
          type: integer
        required: true
      tags:
      - resumes
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Pre-signed download URL generated successfully.
        '401':
          description: Missing or invalid JWT Bearer token.
        '403':
          description: Forbidden - You are not authorized to view candidates for this
            job.
        '404':
          description: Application or resume snapshot not found.
components:
  schemas:
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        job:
          type: integer
        job_title:
          type: string
          readOnly: true
        candidate_name:
          type: string
          readOnly: true
          default: ''
        cover_letter:
          type: string
        applied_at:
          type: string
          format: date-time
          nullable: true
      required:
      - candidate_name
      - id
      - job
      - job_title
    EmailTokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    Job:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        company_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        posted_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - company_name
      - description
      - id
      - posted_at
      - title
    PatchedJob:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        company_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        posted_at:
          type: string
          format: date-time
          readOnly: true
    TokenBlacklist:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT Bearer token
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
